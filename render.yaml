previews:
  generation: off
projects:
  - name: larkspur-tasks
    environments:
      - name: production
        services:
          - type: web
            name: larkspur-web
            runtime: node
            plan: starter
            region: oregon
            buildCommand: npm install
            startCommand: node server.js
            healthCheckPath: /health
            envVars:
              - key: NODE_ENV
                value: production
              - key: DATABASE_URL
                fromDatabase:
                  name: larkspur-db
                  property: connectionString
              - key: REDIS_URL
                fromService:
                  type: keyvalue
                  name: larkspur-redis
                  property: connectionString

          - type: worker
            name: larkspur-worker
            runtime: node
            plan: starter
            region: oregon
            buildCommand: npm install
            startCommand: node worker.js
            envVars:
              - key: NODE_ENV
                value: production
              - key: REDIS_URL
                fromService:
                  type: keyvalue
                  name: larkspur-redis
                  property: connectionString

          - type: cron
            name: larkspur-digest
            runtime: node
            plan: starter
            region: oregon
            schedule: "0 * * * *"
            buildCommand: npm install
            startCommand: node scripts/digest.js
            envVars:
              - key: NODE_ENV
                value: production
              - key: DATABASE_URL
                fromDatabase:
                  name: larkspur-db
                  property: connectionString

          - type: keyvalue
            name: larkspur-redis
            plan: starter
            maxmemoryPolicy: noeviction
            ipAllowList: []

        databases:
          - name: larkspur-db
            plan: basic-1gb
            diskSizeGB: 1
